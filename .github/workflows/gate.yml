name: gate

on:
  workflow_call:
    inputs:
      result:
        description: Aggregate result of the caller check jobs
        required: true
        type: string
      head-sha:
        description: Commit the gate check run is attached to
        required: true
        type: string
    secrets:
      GATE_APP_CLIENT_ID:
        required: false
      GATE_APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    environment: gate
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require gate secrets
        env:
          APP_CLIENT_ID: ${{ secrets.GATE_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.GATE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_KEY" ]; then echo "gate App secrets missing from the gate environment" >&2; exit 1; fi
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.GATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GATE_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Report gate check run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.head-sha }}
          RESULT: ${{ inputs.result }}
        run: |
          conclusion=failure
          if [ "$RESULT" = success ]; then conclusion=success; fi
          gh api -X POST "repos/$REPO/check-runs" \
            -f name=strata/gate \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            --silent
