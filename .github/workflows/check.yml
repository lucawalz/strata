name: check

on:
  workflow_call:
    inputs:
      root:
        description: Notes repository root relative to the checkout
        type: string
        default: "."
      mode:
        description: full runs gitleaks and the diff check, tree runs the tree check only
        type: string
        default: full
      gitleaks-version:
        type: string
        default: "8.30.1"

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
          ROOT: ${{ inputs.root }}
        run: |
          case "${MODE}" in
            full|tree) ;;
            *) echo "mode must be full or tree, got ${MODE}" >&2; exit 2 ;;
          esac
          if [ "${MODE}" = full ] && [ "${ROOT}" != "." ]; then
            echo "mode full needs root \".\", got ${ROOT}; use mode tree for a subdirectory" >&2
            exit 2
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - name: Install gitleaks
        if: inputs.mode != 'tree'
        env:
          VERSION: ${{ inputs.gitleaks-version }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${VERSION}_checksums.txt"
          cd "${RUNNER_TEMP}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/${checksums}"
          sha256sum --ignore-missing -c "${checksums}"
          tar -xzf "${archive}" gitleaks
      - name: Scan history for secrets
        if: inputs.mode != 'tree' && github.event.pull_request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: "\"${RUNNER_TEMP}/gitleaks\" git --redact --log-opts \"${BASE}..${HEAD}\""
      - name: Scan pushed history for secrets
        if: inputs.mode != 'tree' && !github.event.pull_request
        run: '"${RUNNER_TEMP}/gitleaks" git --redact'
      - name: Install strata
        env:
          STRATA_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          STRATA_REF: ${{ fromJSON(toJSON(job)).workflow_sha }}
          GOBIN: ${{ runner.temp }}/bin
          GOWORK: "off"
        run: |
          src="${RUNNER_TEMP}/strata-src"
          git init -q "${src}"
          git -C "${src}" fetch -q --depth 1 "https://github.com/${STRATA_REPOSITORY}" "${STRATA_REF}"
          git -C "${src}" checkout -q FETCH_HEAD
          cd "${src}"
          go install ./cmd/strata
      - name: Check tree
        env:
          ROOT: ${{ inputs.root }}
        run: |
          "${RUNNER_TEMP}/bin/strata" check tree --root "${ROOT}" --format github
      - name: Check diff
        if: ${{ !cancelled() && inputs.mode != 'tree' && github.event.pull_request }}
        env:
          ROOT: ${{ inputs.root }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          "${RUNNER_TEMP}/bin/strata" check diff --root "${ROOT}" --base "${BASE}" --head "${HEAD}" --format github
