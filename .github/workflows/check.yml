name: check

on:
  workflow_call:
    inputs:
      root:
        description: Notes repository root relative to the checkout
        type: string
        default: "."
      mode:
        description: full runs gitleaks and the diff check, tree runs the tree check only
        type: string
        default: full
      gitleaks-version:
        type: string
        default: "8.30.1"

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - name: Install gitleaks
        if: inputs.mode == 'full'
        env:
          VERSION: ${{ inputs.gitleaks-version }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${VERSION}_checksums.txt"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/${checksums}"
          sha256sum --ignore-missing -c "${checksums}"
          tar -xzf "${archive}" gitleaks
      - name: Scan history for secrets
        if: inputs.mode == 'full' && github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --log-opts "${BASE}..${HEAD}"
      - name: Scan pushed history for secrets
        if: inputs.mode == 'full' && github.event_name != 'pull_request'
        run: ./gitleaks git
      - name: Check tree
        env:
          ROOT: ${{ inputs.root }}
          STRATA_REF: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: go run "github.com/lucawalz/strata/cmd/strata@${STRATA_REF}" check tree --root "${ROOT}" --format github
      - name: Check diff
        if: inputs.mode == 'full' && github.event_name == 'pull_request'
        env:
          ROOT: ${{ inputs.root }}
          STRATA_REF: ${{ fromJSON(toJSON(job)).workflow_sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: go run "github.com/lucawalz/strata/cmd/strata@${STRATA_REF}" check diff --root "${ROOT}" --base "${BASE}" --head "${HEAD}" --format github
