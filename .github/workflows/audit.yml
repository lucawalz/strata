name: audit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      code: ${{ steps.audit.outputs.code }}
      findings: ${{ steps.audit.outputs.findings }}
    steps:
      - name: Require push event
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "${EVENT}" != "push" ]; then
            echo "audit runs on push events only, got ${EVENT}" >&2
            exit 2
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - name: Install strata
        env:
          STRATA_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          STRATA_REF: ${{ fromJSON(toJSON(job)).workflow_sha }}
          GOBIN: ${{ runner.temp }}/bin
          GOWORK: "off"
        run: |
          src="${RUNNER_TEMP}/strata-src"
          git init -q "${src}"
          git -C "${src}" fetch -q --depth 1 "https://github.com/${STRATA_REPOSITORY}" "${STRATA_REF}"
          git -C "${src}" checkout -q FETCH_HEAD
          cd "${src}"
          go install ./cmd/strata
      - name: Audit governance commits
        id: audit
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          code=0
          findings="${RUNNER_TEMP}/findings.txt"
          "${RUNNER_TEMP}/bin/strata" audit --before "${BEFORE}" --after "${AFTER}" --format github > "${findings}" || code=$?
          cat "${findings}"
          {
            echo "code=${code}"
            echo "findings<<STRATA_FINDINGS_END"
            cat "${findings}"
            echo "STRATA_FINDINGS_END"
          } >> "${GITHUB_OUTPUT}"
          exit "${code}"

  report:
    needs: audit
    if: always() && needs.audit.outputs.code == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open issue
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FINDINGS: ${{ needs.audit.outputs.findings }}
        run: |
          title="audit: governance commit without owner signature"
          summary="Governance paths changed without a valid owner signature between ${BEFORE} and ${AFTER}."
          if ! grep -q 'title=audit::' <<< "${FINDINGS}"; then
            title="audit: configuration could not be read"
            summary="strata.yml at ${BEFORE} could not be read; the audit of ${BEFORE}..${AFTER} used the default configuration."
          fi
          body="$(printf '%s\n\nFindings:\n\n    %s\n' "${summary}" "${FINDINGS//$'\n'/$'\n'    }")"
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}"
