name: audit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      code: ${{ steps.audit.outputs.code }}
    steps:
      - name: Require push event
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "${EVENT}" != "push" ]; then
            echo "audit runs on push events only, got ${EVENT}" >&2
            exit 2
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - name: Install strata
        env:
          STRATA_REF: ${{ fromJSON(toJSON(job)).workflow_sha }}
          GOBIN: ${{ runner.temp }}/bin
        run: go install "github.com/lucawalz/strata/cmd/strata@${STRATA_REF}"
      - name: Audit governance commits
        id: audit
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          code=0
          "${RUNNER_TEMP}/bin/strata" audit --before "${BEFORE}" --after "${AFTER}" --format github || code=$?
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          exit "${code}"

  report:
    needs: audit
    if: always() && needs.audit.outputs.code == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open issue
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "audit: governance commit without owner signature" \
            --body "Governance paths changed without a valid owner signature between ${BEFORE} and ${AFTER}."
