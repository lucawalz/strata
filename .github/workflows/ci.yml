name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          verify: false

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        run: go test -race ./...

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) "$ACTIONLINT_VERSION"
      - run: ./actionlint -color

  zizmor:
    uses: lucawalz/.github/.github/workflows/zizmor.yml@b4689c6655b628d5b755ad9a12ec7f247a72d392 # v0.2.0
    permissions:
      contents: read

  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Validate skills
        run: |
          for dir in skills/*/; do
            uvx --from skills-ref==0.1.1 agentskills validate "${dir%/}"
          done

  notes-fixture:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read
    with:
      root: testdata/workflow-repo
      mode: tree

  pr-title:
    if: github.event_name == 'pull_request'
    uses: lucawalz/.github/.github/workflows/pr-title.yml@b4689c6655b628d5b755ad9a12ec7f247a72d392 # v0.2.0
    permissions:
      contents: read
      pull-requests: read

  codeql:
    uses: lucawalz/.github/.github/workflows/codeql.yml@b4689c6655b628d5b755ad9a12ec7f247a72d392 # v0.2.0
    permissions:
      contents: read
      security-events: write
    with:
      languages: actions,go
      go-version-file: go.mod

  ci-gate:
    if: always()
    needs:
      - vet
      - lint
      - test
      - actionlint
      - zizmor
      - skills
      - notes-fixture
      - pr-title
      - codeql
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all checks to pass
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: pr-title
